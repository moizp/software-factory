name: Answer Agent Question

# A comment starting with /answer on an issue labelled needs-human answers the question an agent asked (docs/ORCHESTRATION.md,
# "Asking a person"). Checks that the commenter has write access and that the answer fits the question, records it in a
# comment, puts the issue back to agent:ready and starts route.yml, which resumes the pipeline. Code comes from the default
# branch; the comment text is passed through the environment as data and never placed in a shell command. It costs about a
# minute of hosted time per answer.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: write

# One answer at a time per issue, so two quick replies cannot both resume the same question.
concurrency:
  group: answer-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  answer:
    if: >-
      ${{ vars.AGENTS_ENABLED != 'false'
      && !github.event.issue.pull_request
      && github.event.comment.user.type != 'Bot'
      && startsWith(github.event.comment.body, '/answer')
      && contains(github.event.issue.labels.*.name, 'needs-human') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
      COMMENT_BODY: ${{ github.event.comment.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npx ts-node .factory/route/cli.ts answer

name: Policy Check

# Evaluates .factory/policy.json for every PR and labels it policy:auto or policy:manual.
# Code AND policy come from the base branch (never the PR head), so a PR cannot loosen its
# own rules. Informational: the check itself always passes.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  policy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Fetch PR head
        run: git fetch origin "pull/$PR_NUMBER/head:pr-head"

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci

      - name: Evaluate policy
        run: |
          npx ts-node .factory/policy-cli.ts \
            --base "origin/${{ github.event.pull_request.base.ref }}" --head pr-head \
            --branch "$PR_BRANCH" --labels "$PR_LABELS" > decision.json
          cat decision.json
          {
            echo '### Merge policy'
            jq -r 'if .autoMerge then "Auto-merge allowed" else "Needs a human (\(.approvals) approval)" end' decision.json
            echo
            jq -r '.reasons[] | "- " + .' decision.json
            echo
            echo "Required checks: $(jq -r '.require | join(", ")' decision.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Label the PR
        run: |
          gh label create "policy:auto" --color 0E8A16 --description "Policy allows auto-merge" --force
          gh label create "policy:manual" --color D93F0B --description "Policy requires a human merge" --force
          if [ "$(jq -r .autoMerge decision.json)" = "true" ]; then ADD="policy:auto"; DROP="policy:manual"; else ADD="policy:manual"; DROP="policy:auto"; fi
          gh pr edit "$PR_NUMBER" --add-label "$ADD" --remove-label "$DROP"

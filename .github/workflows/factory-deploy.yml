name: Factory Deploy

on:
  workflow_dispatch:
    inputs:
      workflow_id:
        description: 'Workflow ID to deploy'
        required: true

  push:
    branches:
      - main
    paths:
      - '.factory/**'
      - 'dist/**'

jobs:
  check-readiness:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check deployment readiness
        id: check
        run: |
          npm run build
          npm test || exit 1
          echo "ready=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Report readiness
        if: ${{ steps.check.outputs.ready != 'true' }}
        run: |
          echo "❌ Deployment not ready - tests failed"
          exit 1

  deploy:
    needs: check-readiness
    if: ${{ needs.check-readiness.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy to production
        run: |
          echo "Deploying factory orchestrator..."
          echo "Build artifacts ready: dist/"
          ls -la dist/ || echo "No dist directory found"
          echo "✅ Deployment artifacts staged"
        env:
          DEPLOYMENT_ENV: production

      - name: Health check
        run: |
          # Verify application can be imported
          npx ts-node -e "
            const orchestrator = require('./dist/orchestrator.js');
            console.log('✅ Application health check passed');
          " || echo "⚠️ Health check had issues"
        continue-on-error: true

      - name: Rollback on failure
        if: failure()
        run: |
          echo "⚠️ Deployment failed - initiating rollback"
          git log --oneline -5
          exit 1

      - name: Post-deployment notification
        if: success()
        run: |
          echo "✅ Factory deployment successful"
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

  post-deploy-verification:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment
        run: |
          echo "Running post-deployment verification..."
          npm run build
          npm test
          echo "✅ Post-deployment verification passed"

      - name: Collect metrics
        run: |
          echo "Deployment Metrics:"
          echo "- Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "- Commit: ${{ github.sha }}"
          echo "- Branch: ${{ github.ref }}"

name: Factory Test Suite

on:
  # A pull request runs only the tests its change needs (npm run test:changed). Nothing runs for docs-only changes.
  pull_request:
    branches: [main]
    paths:
      - '.factory/**'
      - '.claude/**'
      - 'templates/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.js'
      - 'tsconfig.json'
      - '.nvmrc'
  # The full suite runs on main every Monday, on a release candidate branch, and on demand. A failed run opens an issue.
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: ['release/**']
  workflow_dispatch:

# Read-only by default; the report job below asks for what it needs
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Unit & Integration Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      - name: Run the tests this change needs
        if: github.event_name == 'pull_request'
        run: npm run test:changed -- --base origin/${{ github.base_ref }}
        env:
          CI: true

      - name: Run the full test suite
        if: github.event_name != 'pull_request'
        run: npm test -- --coverage
        env:
          CI: true

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      - name: Check coverage threshold
        if: github.event_name != 'pull_request'
        run: |
          COVERAGE=$(npm run test:coverage -- --silent 2>&1 | grep -oP 'Statements\s*:\s*\K[0-9.]+' | head -1)
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below 70% threshold"
            exit 1
          else
            echo "✅ Coverage $COVERAGE% meets threshold"
          fi

      - name: Archive test results
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    name: Code Quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      - name: Check TypeScript compilation
        run: npm run build

      - name: Verify test structure
        run: |
          echo "Checking test files exist..."
          test -f .factory/__tests__/state.test.ts || (echo "Missing state.test.ts" && exit 1)
          test -f .factory/__tests__/orchestrator.test.ts || (echo "Missing orchestrator.test.ts" && exit 1)
          test -f .factory/__tests__/integration.test.ts || (echo "Missing integration.test.ts" && exit 1)
          test -f .factory/__tests__/fixtures.ts || (echo "Missing fixtures.ts" && exit 1)
          echo "✅ All test files present"

  # Scheduled, release and manual runs have no pull request to show a failure on, so a failure opens one issue (or adds
  # a comment to the one already open) and the next passing run closes it. It does not label the issue agent:ready:
  # a person starts agent work (docs/CLOUD-RUNNERS.md), and an event made by this workflow's token would not start it.
  report:
    name: Report full-run failures
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always() && github.event_name != 'pull_request' && (needs.test.result != 'cancelled' && needs.lint.result != 'cancelled')
    permissions:
      contents: read
      issues: write
    env:
      FAILED: ${{ needs.test.result == 'failure' || needs.lint.result == 'failure' }}
      TEST_RESULT: ${{ needs.test.result }}
      LINT_RESULT: ${{ needs.lint.result }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const label = 'test-failure';
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const failed = process.env.FAILED === 'true';
            try { await github.rest.issues.getLabel({ owner, repo, name: label }); }
            catch { await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205', description: 'The full test suite failed on main' }); }
            const open = (await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open', per_page: 1 })).data[0];
            if (!failed) {
              if (open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `The full test suite passed again: ${run}\n\nClosing.` });
                await github.rest.issues.update({ owner, repo, issue_number: open.number, state: 'closed', state_reason: 'completed' });
              }
              return;
            }
            const line = `Full test suite failed on \`${context.ref.replace('refs/heads/', '')}\` at \`${context.sha.slice(0, 7)}\` (${context.eventName}): tests ${process.env.TEST_RESULT}, code quality ${process.env.LINT_RESULT}. Run: ${run}`;
            if (open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: line });
              return;
            }
            const body = [
              '## What',
              line,
              '',
              '## Why',
              'The full suite runs weekly, on release branches and on demand. Pull requests run only the tests their change needs, so this run can see a break no pull request showed.',
              '',
              '## Next',
              'Read the failing job in the run, find the change that broke it (`git log` on the files the failing test covers), and fix it on a short-lived branch. To hand it to the agents, a person applies `agent:ready`.',
              '',
              'Mission exception: a failing test suite on main blocks every later change, whatever behaviour change it serves.',
            ].join('\n');
            await github.rest.issues.create({ owner, repo, title: 'Full test suite is failing on main', labels: [label], body });

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()

    steps:
      - name: Test results summary
        run: |
          echo "## Software Factory Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Code Quality**: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage Requirements (full runs only: daily on main, release branches, manual)" >> $GITHUB_STEP_SUMMARY
          echo "- Statements: **70%+**" >> $GITHUB_STEP_SUMMARY
          echo "- Branches: **70%+**" >> $GITHUB_STEP_SUMMARY
          echo "- Functions: **70%+**" >> $GITHUB_STEP_SUMMARY
          echo "- Lines: **70%+**" >> $GITHUB_STEP_SUMMARY

      - name: Check test status
        if: needs.test.result != 'success' || needs.lint.result != 'success'
        run: |
          echo "❌ Tests failed. Please review the logs above."
          exit 1

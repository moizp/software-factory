name: Run agent pipeline
description: >
  Runs the factory pipeline for one issue, keeps the lease heartbeat going, then hands the issue back.
  Used by agent-job.yml on the hosted and Oracle lanes. Credentials are passed as inputs and only the
  pipeline step sees them, never npm install.

inputs:
  issue:
    description: Issue number
    required: true
  lane:
    description: short or long
    required: true
  until:
    description: Agent the pipeline stops after
    required: true
  lease_comment:
    description: Id of the lease comment on the issue
    required: true
  gh_token:
    description: Token for gh (issue comments and labels only)
    required: true
  author_token:
    description: Claude account token of the issue author (hosted lane only)
    required: false
    default: ''
  shared_token:
    description: Shared Claude account token (hosted lane only)
    required: false
    default: ''
  api_key:
    description: Anthropic API key fallback (hosted lane only)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: npm

    - name: Install dependencies
      shell: bash
      run: |
        npm ci
        # Default to failure so a cancelled or timed out step is reported as one.
        {
          echo "JOB_RESULT=failure"
          echo "START_EPOCH=$(date +%s)"
        } >> "$GITHUB_ENV"

    - name: Run the pipeline
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        ISSUE_NUMBER: ${{ inputs.issue }}
        LANE: ${{ inputs.lane }}
        UNTIL: ${{ inputs.until }}
        LEASE_COMMENT_ID: ${{ inputs.lease_comment }}
        RUN_ID: ${{ github.run_id }}
        AUTHOR_TOKEN: ${{ inputs.author_token }}
        SHARED_TOKEN: ${{ inputs.shared_token }}
        API_KEY: ${{ inputs.api_key }}
      run: |
        set -u
        # Exactly one credential, never both: with ANTHROPIC_API_KEY present Claude Code would bill the API
        # instead of the account. GITHUB_TOKEN is deliberately not set, so the orchestrator cannot open or merge PRs.
        if [ -n "$AUTHOR_TOKEN" ]; then
          export CLAUDE_CODE_OAUTH_TOKEN="$AUTHOR_TOKEN"; unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
        elif [ -n "$SHARED_TOKEN" ]; then
          export CLAUDE_CODE_OAUTH_TOKEN="$SHARED_TOKEN"; unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
        elif [ -n "$API_KEY" ]; then
          export ANTHROPIC_API_KEY="$API_KEY"; unset CLAUDE_CODE_OAUTH_TOKEN ANTHROPIC_AUTH_TOKEN
        elif [ "$LANE" = "long" ]; then
          # Oracle runner: the writer's local login is used. A key in the environment would shadow it.
          if [ -n "${ANTHROPIC_API_KEY:-}${ANTHROPIC_AUTH_TOKEN:-}" ]; then
            echo "ANTHROPIC_API_KEY or ANTHROPIC_AUTH_TOKEN is set on the runner; remove it so the account login is used."; exit 1
          fi
        else
          echo "No Claude credential for the hosted lane (author account, shared account or API key)."; exit 1
        fi
        unset AUTHOR_TOKEN SHARED_TOKEN API_KEY
        command -v claude >/dev/null || { echo "claude CLI not found on this runner"; exit 1; }

        ( while true; do sleep 600; npx ts-node .factory/route/cli.ts beat || true; done ) &
        HEARTBEAT=$!

        # Issue text is data: it goes into one quoted argument, never into the script.
        BRIEF="$(gh issue view "$ISSUE_NUMBER" --json title,body --jq '.title + "\n\n" + .body')"
        set +e
        FACTORY_IGNORE_WIP=1 npx ts-node .factory/cli.ts start "$BRIEF" "$ISSUE_NUMBER" --until "$UNTIL"
        RESULT=$?
        set -e
        kill "$HEARTBEAT" 2>/dev/null || true
        if [ "$RESULT" -eq 0 ]; then echo "JOB_RESULT=success" >> "$GITHUB_ENV"; fi
        exit "$RESULT"

    - name: Hand the issue back
      if: ${{ always() }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        ISSUE_NUMBER: ${{ inputs.issue }}
        LANE: ${{ inputs.lane }}
        UNTIL: ${{ inputs.until }}
        LEASE_COMMENT_ID: ${{ inputs.lease_comment }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: npx ts-node .factory/route/cli.ts finish

    - name: Keep the workflow state
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: workflow-state-issue-${{ inputs.issue }}-${{ github.run_id }}
        path: |
          workflows/
          logs/
        if-no-files-found: ignore
        retention-days: 14

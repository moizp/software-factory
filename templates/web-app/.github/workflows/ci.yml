name: CI

# The same command developers run locally, so green locally means green here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:all
      - run: npm run build
      # reads the real page: rows of controls, 5 widths, every theme, 3 text sizes, worst-case content (templates/web-app/UI-RULES.md)
      - run: npx playwright install --with-deps chromium
      - run: npm run layout:guard

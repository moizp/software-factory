name: AI Review

# Verification Tier, gate B: AI review on a personal Claude account (primary) or an Anthropic API key (optional fallback).
# Security model: this workflow runs on pull_request_target, so it uses the BASE branch's workflow, scripts and prompts
# and can see secrets (account tokens and, if set, the API key). It therefore must NEVER check out or execute code from the pull request. It only reads the diff
# as data. Gate A (build, tests, lint, SAST, secret scan) runs the PR's code WITHOUT secrets in a separate workflow.
#
# Status: template, not installed here yet. The reviewer script (.factory/review/) exists; the cli runner, the secret-selection
# expression and the posting steps have not run in Actions. Install in shadow mode first (REVIEW_MODE below).

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    # Kill switch: set the repository variable AI_REVIEW_ENABLED to "false" to stop all spending.
    if: ${{ vars.AI_REVIEW_ENABLED != 'false' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REVIEW_MODE: ${{ vars.AI_REVIEW_MODE || 'shadow' }}              # shadow: comment + risk label only; enforce: verdict labels too
      REVIEW_OUT: ${{ runner.temp }}/review-out
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      MONTHLY_BUDGET_USD: ${{ vars.AI_REVIEW_MONTHLY_USD || '25' }}   # applies to the API-key fallback only
      DAILY_REVIEW_CAP: ${{ vars.AI_REVIEW_DAILY_CAP || '20' }}       # protects personal account allowances
    steps:
      - name: Checkout the base branch (trusted code, prompts and policy)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch the PR diff as data (never check out the PR head)
        run: |
          git fetch origin "pull/$PR_NUMBER/head:pr-head"
          git diff --no-renames "origin/$BASE_REF...pr-head" > "$RUNNER_TEMP/pr.diff"
          git diff --numstat --no-renames "origin/$BASE_REF...pr-head" > "$RUNNER_TEMP/pr.numstat"
          gh pr view "$PR_NUMBER" --json title,body,labels,headRefName > "$RUNNER_TEMP/pr.json"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # Pin the CLI so reviews behave the same on every run (keep in step with templates/workspace/versions.env).
      - run: npm install -g "@anthropic-ai/claude-code@${{ vars.CLAUDE_CODE_VERSION || '2.1.292' }}"

      - name: Classify risk (deterministic first), review, post result
        env:
          # Credentials are passed under neutral names so neither is exported by accident.
          # Order: the PR author's own account, then a shared account, then the API key.
          # REVIEW_ACCOUNT_MAP is a repo variable such as {"alice":"CLAUDE_OAUTH_ALICE"}.
          # Verify on first run that an unmapped login resolves to an empty value.
          AUTHOR_TOKEN: ${{ secrets[fromJSON(vars.REVIEW_ACCOUNT_MAP || '{}')[github.event.pull_request.user.login]] }}
          SHARED_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_DIFF: ${{ runner.temp }}/pr.diff
          REVIEW_NUMSTAT: ${{ runner.temp }}/pr.numstat
          REVIEW_PR: ${{ runner.temp }}/pr.json
        run: |
          # Export exactly ONE credential: with ANTHROPIC_API_KEY present Claude Code would use (and bill) the API
          # instead of the account. Never run Claude Code with --bare here: bare mode ignores OAuth tokens.
          if [ -n "$AUTHOR_TOKEN" ]; then
            export CLAUDE_CODE_OAUTH_TOKEN="$AUTHOR_TOKEN" REVIEW_RUNNER=cli REVIEW_ACCOUNT=author
          elif [ -n "$SHARED_TOKEN" ]; then
            export CLAUDE_CODE_OAUTH_TOKEN="$SHARED_TOKEN" REVIEW_RUNNER=cli REVIEW_ACCOUNT=shared
          elif [ -n "$API_KEY" ]; then
            export ANTHROPIC_API_KEY="$API_KEY" REVIEW_RUNNER=api REVIEW_ACCOUNT=api-key
          else
            echo "No Claude credential available: skipping the AI review and leaving the PR for a human."
            gh pr edit "$PR_NUMBER" --add-label "policy:manual" || true
            exit 0
          fi
          unset AUTHOR_TOKEN SHARED_TOKEN API_KEY
          npx ts-node .factory/review/cli.ts

      - name: Upload review result (machine-readable hand-off to the writer)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: review-result-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/review-out/
          if-no-files-found: ignore
          retention-days: 14
